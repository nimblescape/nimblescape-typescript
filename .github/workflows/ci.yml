# Test the extension and build its packages for every push to main and every
# pull request, on the pinned Node.js 24 release (.node-version); VS Code 1.125
# (engines.vscode) and later run extensions on Node.js 24 too. The job "test"
# installs the locked development tools, the locked package of the command ts
# (cli/) and the locked packages of the examples without install scripts,
# checks the types, runs the unit tests, the tests with the TypeScript server
# of the examples and the tests in a real VS Code (stable), packages the VSIX
# with vsce, which also validates the manifest and the README, and packs the
# npm package @nimblescape/typescript of cli/ with npm pack. Both stay workflow
# artifacts for inspection. The job "command" runs the tests of the built
# command ts on Linux and macOS, with the oldest Node.js that ts supports
# (engines of cli/package.json) and the newest LTS release. This workflow
# publishes nothing: the release workflow calls it for the commit of a version
# and publishes the VSIX and the npm package of that call. A change of this
# file changes the release process: its pull request needs a dry run (rule 4).
# The workflow "VS Code versions" calls it once per week with another VS Code
# version; such a call runs only the type check, the unit tests, the tests in
# VS Code and the packages.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this workflow for the commit of a version,
  # because its push of that commit starts no workflow.
  workflow_call:
    inputs:
      ref:
        description: The commit to test and package; empty for the commit of the event.
        type: string
        required: false
        default: ''
      vscode-version:
        description: The VS Code version of the tests in VS Code, "insiders" or a version such as 1.125.0; empty for stable. When set, the tests with the TypeScript server of the examples do not run.
        type: string
        required: false
        default: ''

permissions:
  # Checkout needs repository reads; the checks get no write scope.
  contents: read

env:
  # The two calls of the workflow "VS Code versions" in one workflow run keep their artifacts apart. Empty for every
  # other run, so the release workflow finds the artifact "vsix".
  ARTIFACT_SUFFIX: ${{ inputs.vscode-version && format('-vscode-{0}', inputs.vscode-version) || '' }}

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the locked development tools without install scripts
        run: npm ci --ignore-scripts

      # The package of the extension holds the npm package @nimblescape/typescript of cli/ with its @types/node.
      - name: Install the locked package of the command ts without install scripts
        run: npm ci --ignore-scripts --prefix cli

      # The examples are a workspace like the one of a TypeScript course: TypeScript 6.0.3, @types/node, es-toolkit and
      # @majikmate/ts-utils. The tests with the TypeScript server and the tests in VS Code use them.
      - name: Install the locked packages of the examples without install scripts
        run: npm ci --ignore-scripts --prefix examples

      - name: Check the types
        run: npm run typecheck

      - name: Run the unit tests
        run: npm test

      - name: Run the tests with the TypeScript server of the examples
        if: ${{ !inputs.vscode-version }}
        run: npm run test:tsserver

      # .vscode-test.mjs takes the VS Code version from VSCODE_TEST_VERSION; empty gives stable.
      - name: Run the tests in VS Code
        env:
          VSCODE_TEST_VERSION: ${{ inputs.vscode-version }}
        run: xvfb-run -a npm run test:vscode

      - name: Build the VSIX package
        run: npm run package

      # The production build of the VSIX wrote cli/dist/, so the npm package holds the same command ts as the VSIX.
      - name: Build the npm package
        run: npm pack ./cli

      - name: Keep the VSIX package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix${{ env.ARTIFACT_SUFFIX }}
          path: '*.vsix'
          if-no-files-found: error

      - name: Keep the npm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm${{ env.ARTIFACT_SUFFIX }}
          path: '*.tgz'
          if-no-files-found: error

  command:
    name: Command ts on ${{ matrix.os }} with Node.js ${{ matrix.node }}
    # The workflow "VS Code versions" tests only the parts that depend on VS Code.
    if: ${{ !inputs.vscode-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install the locked development tools without install scripts
        run: npm ci --ignore-scripts

      - name: Install the locked package of the command ts without install scripts
        run: npm ci --ignore-scripts --prefix cli

      # The tests run the built cli/dist/ts.js with this Node.js and the TypeScript of the development tools.
      - name: Run the tests of the command ts
        run: npm run test:cli
