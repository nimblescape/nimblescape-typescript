<!-- The source of resources/icon.png, the Marketplace icon (256 × 256): a list of completions whose middle entry, an import that the program does not need, is crossed out, on the tile of the nimblescape extensions. -->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6db3"/>
      <stop offset="1" stop-color="#1a365d"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="url(#tile)"/>
  <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="44" width="176" height="168" rx="16"/>
    <path d="M100 86H180"/>
    <path d="M100 170H180"/>
  </g>
  <g fill="#fff">
    <circle cx="74" cy="86" r="10"/>
    <circle cx="74" cy="170" r="10"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.4">
    <path d="M100 128H180"/>
  </g>
  <circle cx="74" cy="128" r="10" fill="#fff" opacity="0.4"/>
  <path d="M60 148L196 108" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
</svg>
